# Keeps the CI actions and the Composer constraints current.
# A 7-day cooldown lets a new release settle (and any bad or hijacked
# release get pulled) before a PR is opened for it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    versioning-strategy: widen
    ignore:
      # develop/main are the Filament 3 line (1.x); Filament 4/5 live on 2.x.
      - dependency-name: "filament/*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    target-branch: "2.x"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /
    target-branch: "2.x"
    versioning-strategy: widen
    ignore:
      # A new Filament major needs its own release line, not a constraint bump.
      - dependency-name: "filament/*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
